services:
  mongodb:
    image: mongo:7.0
    container_name: ai-coder-mongodb
    restart: always
    # Don't expose MongoDB port externally to avoid conflicts
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai-coding-assistant

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-coder-backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/ai-coding-assistant
      - PORT=5000
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-coder-frontend
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
